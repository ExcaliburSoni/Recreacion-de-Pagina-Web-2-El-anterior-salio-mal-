<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una vuelta al mundo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="Mundo.jpg" type="image/jpg">
</head>
<body>
  <main>
    <section class="hero" aria-label="Una vuelta al mundo">
      <div class="hero-title">
        <p class="eyebrow"><span></span> UNA VUELTA AL MUNDO</p>
        <h1>Un planeta.<br><em>Seis mundos.</em></h1>
      </div>
    </section>

    <section class="destinos" id="destinos">
      <div class="destinos-heading">
        <h2>ELIGE TU PRÓXIMO DESTINO</h2>
        <span>01 — 06</span>
      </div>
      <div class="destinos-grid">
        <a class="destino" href="#africa" aria-label="África">
          <div class="foto"><img src="africa.avif" alt="Paisaje de África"></div>
          <div class="meta"><span>54 PAÍSES</span><span>01</span></div>
          <h3>África</h3>
        </a>
        <a class="destino" href="#america" aria-label="América">
          <div class="foto"><img src="america.avif" alt="Paisaje de América"></div>
          <div class="meta"><span>35 PAÍSES</span><span>02</span></div>
          <h3>América</h3>
        </a>
        <a class="destino" href="#asia" aria-label="Asia">
          <div class="foto"><img src="asia.avif" alt="Paisaje de Asia"></div>
          <div class="meta"><span>48 PAÍSES</span><span>03</span></div>
          <h3>Asia</h3>
        </a>
        <a class="destino" href="#europa" aria-label="Europa">
          <div class="foto"><img src="europa.avif" alt="Paisaje de Europa"></div>
          <div class="meta"><span>44 PAÍSES</span><span>04</span></div>
          <h3>Europa</h3>
        </a>
        <a class="destino" href="#oceania" aria-label="Oceanía">
          <div class="foto"><img src="oceania.avif" alt="Paisaje de Oceanía"></div>
          <div class="meta"><span>14 PAÍSES</span><span>05</span></div>
          <h3>Oceanía</h3>
        </a>
        <a class="destino" href="#antartida" aria-label="Antártida">
          <div class="foto"><img src="antartida.avif" alt="Paisaje de la Antártida"></div>
          <div class="meta"><span>EL CONTINENTE BLANCO</span><span>06</span></div>
          <h3>Antártida</h3>
        </a>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
